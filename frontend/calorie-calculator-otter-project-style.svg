<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2240" viewBox="0 0 1080 2240">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#493526" flood-opacity=".08"/></filter>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee7f0"/><stop offset="1" stop-color="#f5efe7"/></linearGradient>
    <style>
      .ink{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#493526}
      .muted{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#8b7d70}
      .title{font-size:38px;font-weight:700}.h2{font-size:27px;font-weight:700}.body{font-size:21px}.small{font-size:17px}.num{font-size:48px;font-weight:700;fill:#79648f}.label{font-size:19px;fill:#8b7d70}
    </style>
  </defs>
  <rect width="1080" height="2240" fill="#f8f5ed"/>
  <rect x="24" y="24" width="1032" height="2192" rx="18" fill="#fffcf6" stroke="#e8dfd1" stroke-width="2"/>

  <rect x="24" y="24" width="1032" height="124" rx="18" fill="#fffcf6"/>
  <path d="M82 86h42M82 86l18-18M82 86l18 18" fill="none" stroke="#493526" stroke-width="4" stroke-linecap="round"/>
  <text x="540" y="100" text-anchor="middle" class="ink title">热量计算器</text>
  <circle cx="975" cy="86" r="25" fill="#eee7f0" stroke="#e8dfd1"/>
  <path d="M964 88c2-15 16-22 24-11 8 12-1 28-14 25-8-2-11-7-10-14z" fill="#9d8bb7" opacity=".85"/>

  <rect x="58" y="168" width="964" height="255" rx="18" fill="url(#hero)" stroke="#dacbdd"/>
  <text x="88" y="218" class="muted small" style="letter-spacing:3px;font-weight:700">OTTER WELLNESS</text>
  <text x="88" y="276" class="ink" style="font-size:40px;font-weight:700">把每天的能量，</text>
  <text x="88" y="326" class="ink" style="font-size:40px;font-weight:700;fill:#79648f">算得刚刚好。</text>
  <text x="88" y="370" class="muted small">根据身体数据和生活节奏，找到适合自己的每日热量范围。</text>
  <line x1="690" y1="224" x2="690" y2="364" stroke="#cfc1d4"/>
  <text x="730" y="253" class="muted small">建议每日摄入</text>
  <text x="730" y="316" class="ink" style="font-size:46px;font-weight:700;fill:#79648f">2173</text>
  <text x="730" y="347" class="muted small">千卡 / 天</text>
