  <g class="ink" style="font-size:25px;font-weight:700"><text x="96" y="514">1429 <tspan class="muted small">kcal</tspan></text><text x="320" y="514">1715 <tspan class="muted small">kcal</tspan></text><text x="544" y="514">233 <tspan class="muted small">kcal</tspan></text><text x="768" y="514" fill="#79648f">1948 <tspan class="muted small">kcal</tspan></text></g>

  <!-- basic -->
  <rect x="58" y="570" width="964" height="490" rx="14" fill="#fffcf6" stroke="#e8dfd1" filter="url(#shadow)"/>
  <rect x="82" y="600" width="32" height="32" rx="9" fill="#eee7f0"/><text x="98" y="622" text-anchor="middle" class="ink" style="font-size:11px;font-weight:700;fill:#79648f">01</text>
