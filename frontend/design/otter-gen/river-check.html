<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; padding:28px 16px; background:#f8f5ed; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .card { width:343px; margin:0 auto 22px; background:#fffcf6; border:1px solid #e8dfd1; border-radius:18px; padding:18px 16px 14px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px; }
  .k { font-size:12px; color:#8a7a6a; letter-spacing:.4px; }
  .v { font-size:13px; color:#493526; font-weight:650; }
  .cap { width:343px; margin:0 auto 8px; font-size:11px; color:#9a8b7b; letter-spacing:1px; text-transform:uppercase; }

  /* ===== 与 CalorieRiver.vue 完全一致的样式 ===== */
  .calorie-river { position:relative; isolation:isolate; height:54px; margin:4px 0 12px; overflow:hidden; }
  .river-water,.river-surface { position:absolute; inset:5px 0 0; width:100%; height:44px; overflow:visible; }
  .river-bed { fill:#e7f0e9; }
  .river-current { fill:#c8e1d4; clip-path:inset(0 calc(100% - var(--river-progress)) 0 0); transition:clip-path 800ms ease; }
  .river-ripples,.river-surface { fill:none; stroke:#f8fcf8; stroke-width:1.4; stroke-linecap:round; }
  .river-otter { position:absolute; z-index:1; top:0; left:clamp(38px, var(--otter-position), calc(100% - 38px)); height:47px; width:auto; transform:translateX(-50%); animation:otter-float 3.2s ease-in-out infinite; }
  .river-surface { z-index:2; pointer-events:none; }
  @keyframes otter-float { 0%,100% { transform:translate(-50%,1px) rotate(-1.2deg); } 50% { transform:translate(-50%,-1.5px) rotate(1.2deg); } }
</style>
</head>
<body>
  <div class="cap">intake 0%</div>
  <div class="card">
    <div class="row"><span class="k">今日热量</span><span class="v">0 / 1800 kcal</span></div>
    <div class="calorie-river" style="--river-progress:0%;--otter-position:8%">
      <svg class="river-water" viewBox="0 0 360 44" preserveAspectRatio="none"><path class="river-bed" d="M12 10 C38 7 58 12 88 9 S140 8 170 10 S220 12 250 9 S310 8 348 11 L348 34 C320 37 290 33 260 35 S210 36 180 34 S130 32 100 35 S45 36 12 33 Q5 22 12 10Z"/><path class="river-current" d="M12 10 C38 7 58 12 88 9 S140 8 170 10 S220 12 250 9 S310 8 348 11 L348 34 C320 37 290 33 260 35 S210 36 180 34 S130 32 100 35 S45 36 12 33 Q5 22 12 10Z"/><g class="river-ripples"><path d="M54 18c9-3 18-3 27 0m31 8c8-3 16-3 24 0m117-9c8-2 16-2 24 0m-69 12c7-2 13-2 20 0"/><path d="M82 29c5-2 10-2 15 0m149-13c5-2 10-2 15 0"/></g></svg>
      <img class="river-otter" src="../../src/assets/otter/river-otter.png" alt="">
      <svg class="river-surface" viewBox="0 0 360 44" preserveAspectRatio="none"><path d="M8 30c18-3 30 3 48 0s29-2 45 0m137 0c16-3 29 2 44 0s24-2 38 0"/><path d="M31 35c9-2 17 1 26 0m228-1c8-2 16 1 24 0"/></svg>
    </div>
  </div>

  <div class="cap">intake 45%</div>
  <div class="card">
    <div class="row"><span class="k">今日热量</span><span class="v">810 / 1800 kcal</span></div>
    <div class="calorie-river" style="--river-progress:45%;--otter-position:45.8%">
      <svg class="river-water" viewBox="0 0 360 44" preserveAspectRatio="none"><path class="river-bed" d="M12 10 C38 7 58 12 88 9 S140 8 170 10 S220 12 250 9 S310 8 348 11 L348 34 C320 37 290 33 260 35 S210 36 180 34 S130 32 100 35 S45 36 12 33 Q5 22 12 10Z"/><path class="river-current" d="M12 10 C38 7 58 12 88 9 S140 8 170 10 S220 12 250 9 S310 8 348 11 L348 34 C320 37 290 33 260 35 S210 36 180 34 S130 32 100 35 S45 36 12 33 Q5 22 12 10Z"/><g class="river-ripples"><path d="M54 18c9-3 18-3 27 0m31 8c8-3 16-3 24 0m117-9c8-2 16-2 24 0m-69 12c7-2 13-2 20 0"/><path d="M82 29c5-2 10-2 15 0m149-13c5-2 10-2 15 0"/></g></svg>
      <img class="river-otter" src="../../src/assets/otter/river-otter.png" alt="">
      <svg class="river-surface" viewBox="0 0 360 44" preserveAspectRatio="none"><path d="M8 30c18-3 30 3 48 0s29-2 45 0m137 0c16-3 29 2 44 0s24-2 38 0"/><path d="M31 35c9-2 17 1 26 0m228-1c8-2 16 1 24 0"/></svg>
    </div>
  </div>

      <svg class="river-water" viewBox="0 0 360 44" preserveAspectRatio="none"><path class="river-bed" d="M12 10 C38 7 58 12 88 9 S140 8 170 10 S220 12 250 9 S310 8 348 11 L348 34 C320 37 290 33 260 35 S210 36 180 34 S130 32 100 35 S45 36 12 33 Q5 22 12 10Z"/><path class="river-current" d="M12 10 C38 7 58 12 88 9 S140 8 170 10 S220 12 250 9 S310 8 348 11 L348 34 C320 37 290 33 260 35 S210 36 180 34 S130 32 100 35 S45 36 12 33 Q5 22 12 10Z"/><g class="river-ripples"><path d="M54 18c9-3 18-3 27 0m31 8c8-3 16-3 24 0m117-9c8-2 16-2 24 0m-69 12c7-2 13-2 20 0"/><path d="M82 29c5-2 10-2 15 0m149-13c5-2 10-2 15 0"/></g></svg>
      <img class="river-otter" src="../../src/assets/otter/river-otter.png" alt="">
      <svg class="river-surface" viewBox="0 0 360 44" preserveAspectRatio="none"><path d="M8 30c18-3 30 3 48 0s29-2 45 0m137 0c16-3 29 2 44 0s24-2 38 0"/><path d="M31 35c9-2 17 1 26 0m228-1c8-2 16 1 24 0"/></svg>
    </div>
  </div>
</body>
</html>
