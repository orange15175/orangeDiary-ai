<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{width:390px;margin:0 auto;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;background:#e8e2d8}
.search-row{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 11px}
.search-row .ph{flex:1;color:#a2947f;font-size:14px}
.search-row .dot{width:15px;height:15px;border:2px solid #8b7d70;border-radius:50%;border-right-color:transparent;border-bottom-color:transparent;transform:rotate(-45deg);flex:none}
.back-button{display:grid;place-items:center;font-size:17px}
.row-arrow{flex:none;color:#c9bcae;font-size:14px;font-style:normal}
.row-arrow::before{content:"›"}
.label{padding:14px;margin:0;font:11px ui-monospace,monospace;letter-spacing:1.2px;color:#7d6f63}

.exercise-browser-page {
  --ink: #493526;
  --muted: #8b7d70;
  --brand: #9d8bb7;
  --brand-strong: #79648f;
  --brand-soft: #eee7f0;
  --line: #e8dfd1;
  --surface: #fffcf6;
  --page-bg: #f8f5ed;
  --warm: #f7e9e2;
  --warm-ink: #a8613f;
  --van-loading-spinner-color: var(--brand);
  min-height: 100dvh;
  padding: max(18px, env(safe-area-inset-top)) 14px
    max(32px, env(safe-area-inset-bottom));
  background: var(--page-bg);
  color: var(--ink);
}
.browser-header {
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(100%, 760px);
  margin: auto;
}
.browser-header .back-button {
  width: 42px;
  height: 42px;
  border-color: var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 3px 10px rgb(73 53 38 / 5%);
}
.search-box {
  flex: 1;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  transition:
    border-color 150ms ease,
    box-shadow 150ms ease;
}
.search-box:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgb(157 139 183 / 14%);
}
.search-box .van-cell {
  min-height: 42px;
  padding: 8px 11px;
  background: transparent;
  color: var(--ink);
}
.search-box .van-field__left-icon {
  color: var(--muted);
}
.search-box .van-field__control {
  color: var(--ink);
  font-size: 14px;
}
.search-box .van-field__control::placeholder {
  color: #a2947f;
}
.context-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: min(100%, 760px);
  margin: 16px auto 12px;
  color: var(--muted);
  font-size: 12px;
}
.context-line strong {
  color: var(--brand-strong);
  font-size: 13px;
}
.browser-shell {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  width: min(100%, 760px);
  min-height: calc(100dvh - 132px);
  margin: auto;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: 0 5px 18px rgb(73 53 38 / 4%);
}
.category-nav {
  display: grid;
  align-content: start;
  padding: 8px 0;
  border-right: 1px solid var(--line);
  background: #faf7f0;
}
.category-nav button {
  min-height: 46px;
  border: 0;
  border-left: 3px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  transition:
    background 150ms ease,
    color 150ms ease;
}
.category-nav button.active {
  border-left-color: var(--brand-strong);
  background: var(--brand-soft);
  color: var(--brand-strong);
  font-weight: 700;
}
.category-nav button:focus-visible,
.exercise-list li:focus-visible,
.load-more:focus-visible {
  position: relative;
  z-index: 1;
  outline: 2px solid var(--brand-strong);
  outline-offset: -2px;
}
.exercise-panel {
  min-width: 0;
  padding: 0 14px 18px;
}
.exercise-panel > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 52px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line);
}
.exercise-panel > header strong {
  font-size: 16px;
  font-weight: 650;
}
.exercise-panel > header span {
  color: var(--muted);
  font-size: 12px;
}
.state {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 240px;
  color: var(--muted);
  font-size: 13px;
}
.state .van-loading__text {
  color: var(--muted);
  font-size: 13px;
}
.empty {
  flex-direction: column;
  gap: 12px;
  padding: 32px 12px;
  text-align: center;
}
.empty-mark {
  display: grid;
  width: 54px;
  height: 54px;
  place-items: center;
  border: 1px solid rgb(73 53 38 / 6%);
  border-radius: 16px;
  background: var(--warm);
  color: var(--warm-ink);
}
.empty-mark svg {
  width: 24px;
  height: 24px;
}
.empty p {
  max-width: 220px;
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
}
.exercise-list {
  padding: 0;
  margin: 0;
  list-style: none;
}
.exercise-list li {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 68px;
  border-bottom: 1px solid #eee8de;
  cursor: pointer;
  transition: background 120ms ease;
}
.exercise-list li:last-child {
  border-bottom: 0;
}
.exercise-list li:active {
  background: #faf7f0;
}
.exercise-icon {
  display: grid;
  width: 42px;
  height: 42px;
  flex: none;
  place-items: center;
  border: 1px solid rgb(73 53 38 / 6%);
  border-radius: 9px;
  background: var(--warm);
  color: var(--warm-ink);
}
.exercise-icon svg {
  width: 20px;
  height: 20px;
}
.icon-aerobic {
  background: #f7e9e2;
  color: #a8613f;
}
.icon-strength {
  background: #eee7f0;
  color: #79648f;
}
.icon-ball {
  background: #e8eee3;
  color: #5c7859;
}
.icon-flex {
  background: #f5edda;
  color: #8b7449;
}
.exercise-list li > div {
  flex: 1;
  min-width: 0;
}
.exercise-list strong,
.exercise-list span,
.exercise-list em {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.exercise-list strong {
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
}
.exercise-list span {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}
.exercise-list em {
  margin-top: 4px;
  color: var(--warm-ink);
  font-size: 11px;
  font-style: normal;
}
.row-arrow {
  flex: none;
  color: #c9bcae;
  font-size: 14px;
}
.load-more {
  display: block;
  width: 100%;
  margin-top: 14px;
  border-radius: 9px;
  --van-button-default-color: var(--brand-strong);
  --van-button-default-border-color: #d8cde1;
  --van-button-default-background: transparent;
}
@media (max-width: 360px) {
  .exercise-browser-page {
    padding-right: 10px;
    padding-left: 10px;
  }
  .browser-shell {
    grid-template-columns: 78px minmax(0, 1fr);
  }
  .exercise-panel {
    padding-right: 10px;
    padding-left: 10px;
  }
  .exercise-list li {
    gap: 8px;
    min-height: 64px;
  }
  .exercise-icon {
    width: 38px;
    height: 38px;
  }
  .exercise-icon svg {
    width: 18px;
    height: 18px;
  }
}


.exercise-browser-page{min-height:auto;padding-bottom:10px}
.browser-shell{min-height:auto}
</style></head><body>

    </section>
  </div>
</main>
</body></html>
