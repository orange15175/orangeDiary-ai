<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#f8f5ed;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.card{background:#fffcf6;border:1px solid #e8dfd1;border-radius:18px;padding:20px;max-width:560px}
.row{display:flex;gap:26px;align-items:flex-end;margin-bottom:22px}
.item{text-align:center}
.item img{display:block;margin:0 auto}
.cap{display:block;margin-top:8px;font:10px ui-monospace,monospace;letter-spacing:1px;color:#8b7d70}
h2{margin:0 0 16px;font-size:13px;color:#493526;letter-spacing:.4px}
</style></head><body>
<div class="card">
  <h2>哑铃换黑 · 实尺寸对照（暖白卡面 #fffcf6）</h2>
  <div class="row">
    <div class="item"><img src="dumbbell.before.png" width="72"><span class="cap">BEFORE 72PX</span></div>
    <div class="item"><img src="dumbbell-black.png" width="72"><span class="cap">AFTER 72PX</span></div>
    <div class="item"><img src="dumbbell.before.png" width="110"><span class="cap">BEFORE 110PX</span></div>
    <div class="item"><img src="dumbbell-black.png" width="110"><span class="cap">AFTER 110PX</span></div>
  </div>
  <div class="row">
    <div class="item"><img src="dumbbell.before.png" width="180"><span class="cap">BEFORE 180PX</span></div>
    <div class="item"><img src="dumbbell-black.png" width="180"><span class="cap">AFTER 180PX</span></div>
  </div>
</div>
</body></html>
