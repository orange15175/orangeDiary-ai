[pytest]
testpaths = tests
# 严格标记：未注册的 marker 直接报错，避免"忘了加 integration 标记"的用例混进离线组。
addopts = --strict-markers
# 显式声明异步 fixture 的 loop scope，避免 pytest-asyncio 未来版本改默认值时行为漂移。
asyncio_default_fixture_loop_scope = function
markers =
    integration: 需要真实 MySQL/Redis，先启动 deploy/compose.test.yml
    live: 调用真实付费模型，默认不进 CI
