# 集成测试专用依赖：真实 MySQL 8 + Redis，用完即弃。
#
# 与开发/生产编排完全隔离：独立 project name、独立端口、tmpfs 数据目录。
#   docker compose -f deploy/compose.test.yml up -d --wait
#   docker compose -f deploy/compose.test.yml down -v
#
# 注意：这里的数据目录是 tmpfs，容器一停数据就没了——这是刻意的，
# 集成测试不允许把测试数据留在机器上，也不允许指到业务库。

name: orange-diary-test

services:
  test-mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # asyncmy / aiomysql 对 caching_sha2 的支持依赖额外组件，测试库统一用 native password
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:-test-root}
      MYSQL_DATABASE: ${TEST_MYSQL_BOOTSTRAP_DB:-orange_diary_test_bootstrap}
      MYSQL_USER: ${TEST_MYSQL_USER:-orange_test}
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:-orange_test}
      TZ: Asia/Shanghai
    ports:
      - "${TEST_MYSQL_PORT:-3307}:3306"
    volumes:
      - ./test-db-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql:size=1g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  test-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${TEST_REDIS_PORT:-6380}:6379"
    tmpfs:
      - /data:size=64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
